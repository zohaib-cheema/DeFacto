[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "defacto-lab"
version = "0.1.0"
description = "Reproducible classification experiments and SQL reports"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3.1", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "joblib>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
defacto = "defacto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
defacto = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
